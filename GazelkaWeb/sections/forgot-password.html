<section class="auth-overlay" id="auth-section">
  <main class="auth-container">
    <div class="auth-card">
      <h2 class="auth-card__title" style="text-transform: none; font-weight: 700;">Password recovery</h2>

      <button type="submit" class="btn--auth-submit" style="font-family: 'DM Sans', sans-serif;">Send code</button>

      <form class="auth-form" id="forgot-password-form">
        <div class="input-box">
          <label style="font-family: inherit;">Code from email</label>
          <input 
            type="text" 
            id="recovery-code" 
            placeholder="Enter code from email"
            required 
            style="font-family: inherit;"
          />
        </div>

        <div class="input-box">
          <label style="font-family: inherit;">New password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="new-password" 
              class="auth-input"
              placeholder="Enter new password"
              required 
              style="font-family: 'DM Sans', sans-serif;"
            />
            <button type="button" id="toggle-new-password" class="password-toggle-btn">
              <img id="new-password-icon" src="assets/icons/ic_visibility_off.svg" alt="Toggle" />
            </button>
          </div>
        </div>

        <button type="submit" class="btn--auth-submit" style="font-family: 'DM Sans', sans-serif;">Save changes</button>
        
        <p class="auth-link-text" style="text-align: center; font-family: 'DM Sans', sans-serif; color: #fff; margin-top: 16px; font-size: 14px;">
          Didn't get an email? <a href="#" id="resend-code-link" style="font-family: 'DM Sans', sans-serif; color: #f1c40f; text-decoration: none; font-weight: 700;">Resend it</a>
        </p>
      </form>

      <p class="auth-switch">
        Remember your password?
        <a href="javascript:void(0);" id="back-to-login-link">Login!</a>
      </p>
    </div>
  </main>
</section>
